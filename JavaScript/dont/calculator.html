<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"></head>
<body>
    <form class="card w-100 mt-5 border p-5">
    <div class="row d-flex m-auto shadow-lg p-5 rounded-3">
        <div>
            <label for="num1" class="fs-4 p-2 w-75 fw-bold">Number 1</label>
            <input type="number" class="card w-75 p-2" id="num1" placeholder="Enter first number">
                
            <label for="num2" class="fs-4 p-2 w-75 fw-bold">Number 2</label>
            <input type="number" class="card w-75 p-2" id="num2" placeholder="Enter second number">
                
            <label for="num3" class=" fs-4 p-2 w-75 fw-bold">Number 3</label>
            <input type="number" class="card w-75 p-2" id="num3" placeholder="Enter third number">
        </div>
        <label for="num4" class=" fs-4 p-2 w-75 fw-bold">Number 4</label>
        <input type="number" class="card w-75 p-2" id="num4" placeholder="Enter fourth number">
        <div>
            <form class="card w-100 border p-5 ">
                <button type="button" class="btn btn-secondary bg-danger mt-3 " onclick="plus()">+</button>
                <button type="button" class="btn btn-secondary bg-danger mt-3" onclick="minus()">-</button>
                <button type="button" class="btn btn-secondary bg-danger mt-3" onclick="multiply()">*</button>
                <button type="button" class="btn btn-secondary bg-danger mt-3" onclick="divide()">/</button>
            </form><br>
            <button type="button" class="btn btn-primary mt-3" onclick="calculate()">Calculate</button>
            <div id="result"></div>
    </div>
    </form>
    <script>
        let operator = "";

        function plus() {
            operator = "+";
        }

        function minus() {
            operator = "-";
        }

        function multiply() {
            operator = "*";
        }

        function divide() {
            operator = "/";
        }

        function calculate() {
            let num1 = Number(document.getElementById("num1").value);
            let  num2 = Number(document.getElementById("num2").value);
            let num3 = Number(document.getElementById("num3").value);
            let num4 = Number(document.getElementById("num4").value);
            let result = 0;

            switch (operator) {
                case "+":
                    result = num1 + num2 + num3 + num4;
                    break;
                case "-":
                    result = num1 - num2 - num3 - num4;
                    break;
                case "*":
                    result = num1 * num2 * num3 * num4;
                    break;
                case "/":
                    result = num1 / num2 / num3 / num4;
                    break;
                default:
                    return;
            }

            document.getElementById("result").innerHTML = `
                <table class="table table-bordered mt-4">

                    <tr><th>Operator</th><td>${operator}</td></tr>
                    <tr><th>Number 1</th><td>${num1}</td></tr>
                    <tr><th>Number 2</th><td>${num2}</td></tr>
                    <tr><th>Number 3</th><td>${num3}</td></tr>
                    <tr><th>Number 4</th><td>${num4}</td></tr>
                    <tr><th>Result</th><td>${result}</td></tr>
                </table>
            `;
        }
    </script>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script></body>
</html>
