<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="input">
    <button type="button" onclick="add()">Add</button>
    <button type="button" onclick="add()">Delete</button>
    <ul id="result">

    </ul>
    
    <script>
        let Car = [];

        function add() {
            let input = document.getElementById("input");

            Car.push(input.value);
            document.getElementById("result").innerHTML += `<li>${input.value}</li>`;
            input.value = "";
        }

    </script>
</body>
</html>
