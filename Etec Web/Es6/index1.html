        function card(product){
            product.map((p)=>{

                document.write("Name = " + p.name + "</br>")
                document.write("Price = " + p.price + "</br>")
            })
        }
        
        function shop(sell){

                document.write("ID = " + s.id + "</br>")

                document.write("ID = " + s.price + "</br>")
            })
            shop (sell);
        }

                {

        Home();
