<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product list</title>
</head>
<body>
    <table border="1" style="width: 70%; font-size: 40px;">
        <thead>
            <tr>
                <!-- Colspan to span all columns it literally means center -->
                <th colspan="5">List Product</th>
            </tr>
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Catetogory</th>
                <th>Discribtion</th>
                <th>Price</th>
            </tr>
            <tr align="center">
                <td colspan="1"><img style="width: 100px; height: 100px;" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvCrSj4ItvbWb8-QqfAybI0BWUJLCtH6ByweecW3r8EEe3gn2mK2y230RQilP8egdW6JgsDtf091z4RTrY6NOH2dInP_Cx46gs9F04kbM&s=10" alt=""></td>
                <td>Banana</td>
                <td>Fruit</td>
                <td>Yellow and sweet</td>
                <td>$1.99</td>
            </tr>
            <tr align="center">
                <td colspan="1"><img style="width: 150px; height: 100px;" src="https://i.pinimg.com/736x/13/ff/77/13ff77bf458254385bc96c3fd18d3cc7.jpg" alt=""></td>
                <td>Cat</td>
                <td>Animal</td>
                <td>Fluffy and cute</td>
                <td>$5.99</td>
            </tr>
        </thead>
    </table>
</body>
</html>
