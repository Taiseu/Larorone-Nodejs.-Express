<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1 style="font-size: 50px; color: red;"><i><u>Learn About Table Tag</u></i></h1>
    <hr size="5" color="red">
<!-- Knong table mean tr(table row) -->
    <table align="CENTER" style="width: 60%; font-size: 40px;" border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Gender</th>
            <th>Score</th>
        </tr>
        <tr align="center">
            <td>001</td>
            <td>Seu</td>
            <td>Male</td>
            <td>85</td>
        </tr>
        <tr align="center">
            <td>002</td>
            <td>Alice</td>
            <td>Female</td>
            <td>90</td>
        </tr>

    </table>


</body>
</html>
