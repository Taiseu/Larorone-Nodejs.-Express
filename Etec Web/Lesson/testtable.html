<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center; color: red; font-size: 50px;"><i><u>Table</u></i></h1>
    <hr size="5" color="red">

    <table border="1" style="width: 70%; font-size: 40px;">
        <thead>
            <tr>
                <!-- Colspan to span all columns it literally means center -->
                <th colspan="4">A</th>
            </tr>
            <tr>
                <th rowspan="2">A</th>
                <th>B</th>
                <th>C</th>
                <th rowspan="2">D</th>
            </tr>
            <tr align="center">
                <td>E</td>
                <td>F</td>
            </tr>
            <tr>
                <td colspan="2" align="center">G</td>
                <td colspan="2" align="center">H</td>
            </tr>
            <tr>
                <td rowspan="2" colspan="2" align="center">I</td>
                <td colspan="1" align="center">J</td>
                <td colspan="2" align="center">K</td>
            </tr>
            <tr>
                <td colspan="3" align="center">L</td>
            </tr>
        </thead>
    </table>
</body>
</html>
