<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-image: url(https://images.pexels.com/photos/35389652/pexels-photo-35389652/free-photo-of-sunset-at-the-maiden-s-tower-in-istanbul-turkiye.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2);">
    <h1 style="text-align: center; color: blue; font-size: 50px;"><i><u>Login</u></i></h1>
    <hr size="5" color="blue">

    <form action="" style="border: 2px solid blue; background-color: rgba(240, 248, 255, 0.192); border-radius: 25px; padding: 15px; width: 30vw; height: 60vh; margin: auto;" >
        <h2 style="color: skyblue; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; text-align: center; font-size: 40px;">Login</h2>

        <label for="Email">Email</label><br>
        <input type="text"placeholder="Enter your email" style="width: 95%; height: 40px; font-size: 20px; border-radius: 15px; margin-top: 5px;"><br><br>
        <label for="Password">Password</label><br>
        <input type="password"placeholder="Enter your password" style="width: 95%; height: 40px; font-size: 20px; border-radius: 15px; margin-top: 5px;"><br><br>
        <p style="font-size: 15px; text-align: center; color: blue;">Remember me Forgot Password</p>
        <button style="width: 97%; font-size: 20px; height: 40px; border-radius: 15px;">Login</button>
    </form>

</body>
</html>
